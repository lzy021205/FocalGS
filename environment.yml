name: FocalGS
channels:
  - pyg
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  - numpy<2
  - gcc_linux-64=11
  - gxx_linux-64=11
  - cudatoolkit=11.8
  - pytorch::pytorch=2.2.0=py3.9_cuda11.8_cudnn8.7.0_0
  - pytorch::torchvision=0.17.0=py39_cu118
  - pytorch::torchaudio=2.2.0=py39_cu118
  - tqdm
  - plyfile=0.8.1
  - matplotlib
  - colorama
  - pip:
      - numpy<2
      - opencv-python==4.11.0.86
      - mmcv==1.6.0
      - einops
      - wandb
      - lpips
      - laspy
      - open3d==0.19.0
      - torchmetrics
      - jaxtyping
      - torch_scatter==2.1.2 -f https://data.pyg.org/whl/torch-2.2.0+cu118.html
      - pytorch-msssim
      - imageio[ffmpeg]
      - submodules/diff-gaussian-rasterization
      - submodules/simple-knn
      - submodules/tiny-cuda-nn/bindings/torch
